<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog</title>
    <link rel="stylesheet" href="../assets/css/tailwind.css" />
    <link rel="stylesheet" href="css/style.css" />

  </head>
  <body class="bg-gray-50 blog-list-page">
    <!-- Navigation -->
    <nav class="fixed top-0 left-0 right-0 z-50 bg-white/95 backdrop-blur-sm border-b border-gray-200">
      <div class="blog-header-container py-3">
        <div class="blog-header-row flex items-center gap-2">
          <img src="images/jino_icon.png" alt="프로필 아이콘" class="w-10 h-10 rounded-lg object-contain flex-shrink-0" />
          <a href="../" class="text-xl font-bold text-gray-950 hover:text-black transition-colors">MrJino</a>
          <div class="flex-1"></div>
          <div class="blog-header-tools flex gap-6 items-center">
            <!-- Search -->
            <form class="blog-search relative" action="./" method="get" role="search">
              <input
                type="text"
                id="searchInput"
                name="q"
                aria-label="블로그 검색"
                placeholder="블로그 검색..."
                class="w-64 px-4 py-2 pr-10 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                oninput="searchPosts(this.value)"
              />
              <svg class="w-5 h-5 absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
              </svg>
            </form>
          </div>
        </div>
      </div>
    </nav>

    <div class="blog-content-width pt-24 pb-8">
      <div class="blog-layout flex gap-8">
        <!-- Sidebar - Categories -->
        <aside class="blog-sidebar w-64 flex-shrink-0">
          <div class="bg-white rounded-lg shadow-sm border border-gray-200 sticky top-24">
            <div class="p-4 border-b border-gray-200">
              <h2 class="text-lg font-bold text-gray-900">카테고리</h2>
            </div>
            <nav id="categoryNav" class="p-2">
              <!-- Categories will be loaded here -->
            </nav>
          </div>
        </aside>

        <!-- Main Content - Blog Grid -->
        <main class="blog-results flex-1">
          <div id="blogList">
          <!-- Category Title -->
          <div class="mb-6">
            <h2 id="categoryTitle" class="text-3xl font-bold text-gray-900">전체 글</h2>
            <p id="categoryCount" role="status" aria-live="polite" class="text-gray-600 mt-2">12개의 글</p>
          </div>

          <!-- Blog Grid -->
          <div id="blogGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Blog cards will be loaded here -->
          </div>

          <!-- Empty State -->
          <div id="emptyState" class="hidden text-center py-16">
            <svg class="w-16 h-16 mx-auto text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
              />
            </svg>
            <p class="text-gray-500 text-lg">검색 결과가 없습니다</p>
          </div>
          </div>
          <section id="inlinePost" hidden aria-labelledby="postTitle">
            <button type="button" id="backToBlogList" class="blog-back-link">← 목록으로</button>
      <!-- Post Header -->
      <article class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
        <!-- Category & Date -->
        <div class="px-8 pt-8 pb-4">
          <div class="flex items-center gap-4 mb-4">
            <span id="postCategory" class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-blue-100 text-blue-700"> Category </span>
            <span id="postDate" class="text-sm text-gray-500">2024.01.01</span>
            <span id="postReadTime" class="text-sm text-gray-500 flex items-center gap-1">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
              5분
            </span>
          </div>

          <!-- Title -->
          <h1 id="postTitle" class="text-4xl font-bold text-gray-900 mb-4">Post Title</h1>

          <!-- Tags -->
          <div id="postTags" class="flex gap-2 flex-wrap mb-6">
            <!-- Tags will be inserted here -->
          </div>
        </div>

        <!-- Thumbnail -->
        <div id="postThumbnail" class="w-full aspect-video bg-gradient-to-br from-blue-400 to-cyan-500">
          <!-- Gradient background -->
        </div>

        <!-- Content -->
        <div class="px-8 py-8">
          <div id="postContent" class="markdown-content">
            <!-- Markdown content will be rendered here -->
          </div>
        </div>
      </article>

      <!-- Navigation -->
      <div class="mt-8 flex justify-between items-center">
        <button
          id="prevPost"
          onclick="navigateInlinePost('prev')"
          class="flex items-center gap-2 px-4 py-2 text-gray-700 hover:text-blue-600 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
          </svg>
          <span class="text-sm font-medium">이전 글</span>
        </button>
        <button
          id="nextPost"
          onclick="navigateInlinePost('next')"
          class="flex items-center gap-2 px-4 py-2 text-gray-700 hover:text-blue-600 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
        >
          <span class="text-sm font-medium">다음 글</span>
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
          </svg>
        </button>
      </div>
          </section>
        </main>
      </div>
    </div>

    <script src="js/blog-data.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/inline-post.js"></script>

  </body>
</html>
