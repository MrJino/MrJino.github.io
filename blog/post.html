<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog Post</title>
    <link rel="stylesheet" href="../assets/css/tailwind.css" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="css/style.css" />

  </head>
  <body class="bg-gray-50 blog-list-page blog-post-page">
    <!-- Header -->
    <nav class="fixed top-0 left-0 right-0 z-50 bg-white/95 backdrop-blur-sm border-b border-gray-200">
      <div class="blog-header-container py-3">
        <div class="blog-header-row flex items-center gap-2">
          <img src="images/jino_icon.png" alt="프로필 아이콘" class="w-10 h-10 rounded-lg object-contain flex-shrink-0" />
          <a href="../index.html" class="text-xl font-bold text-gray-950 hover:text-black transition-colors">MrJino</a>
          <div class="flex-1"></div>
          <div class="blog-header-tools flex gap-6 items-center">
            <!-- Search -->
            <form class="blog-search relative" action="index.html" method="get" role="search">
              <input
                type="text"
                id="searchInput"
                name="q"
                aria-label="블로그 검색"
                placeholder="블로그 검색..."
                class="w-64 px-4 py-2 pr-10 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              />
              <svg class="w-5 h-5 absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
              </svg>
            </form>
          </div>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="blog-content-width py-12">
      <a href="index.html" class="blog-back-link">← 목록으로</a>
      <!-- Post Header -->
      <article class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
        <!-- Category & Date -->
        <div class="px-8 pt-8 pb-4">
          <div class="flex items-center gap-4 mb-4">
            <span id="postCategory" class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-blue-100 text-blue-700"> Category </span>
            <span id="postDate" class="text-sm text-gray-500">2024.01.01</span>
            <span id="postReadTime" class="text-sm text-gray-500 flex items-center gap-1">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
              5분
            </span>
          </div>

          <!-- Title -->
          <h1 id="postTitle" class="text-4xl font-bold text-gray-900 mb-4">Post Title</h1>

          <!-- Tags -->
          <div id="postTags" class="flex gap-2 flex-wrap mb-6">
            <!-- Tags will be inserted here -->
          </div>
        </div>

        <!-- Thumbnail -->
        <div id="postThumbnail" class="w-full aspect-video bg-gradient-to-br from-blue-400 to-cyan-500">
          <!-- Gradient background -->
        </div>

        <!-- Content -->
        <div class="px-8 py-8">
          <div id="postContent" class="markdown-content">
            <!-- Markdown content will be rendered here -->
          </div>
        </div>
      </article>

      <!-- Navigation -->
      <div class="mt-8 flex justify-between items-center">
        <button
          id="prevPost"
          onclick="navigatePost('prev')"
          class="flex items-center gap-2 px-4 py-2 text-gray-700 hover:text-blue-600 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
          </svg>
          <span class="text-sm font-medium">이전 글</span>
        </button>
        <button
          id="nextPost"
          onclick="navigatePost('next')"
          class="flex items-center gap-2 px-4 py-2 text-gray-700 hover:text-blue-600 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
        >
          <span class="text-sm font-medium">다음 글</span>
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
          </svg>
        </button>
      </div>
    </main>

    <script src="js/blog-data.js"></script>
    <script src="js/post.js"></script>
  </body>
</html>
