<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f5f0" />
    <meta name="description" content="MrJino의 포트폴리오, 블로그, 히스토리와 플레이그라운드로 연결되는 공간입니다." />
    <title>MrJino</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="assets/css/home.css" />
    <script src="assets/js/i18n.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#destinations">메뉴로 바로가기</a>
    <div class="home-shell">
      <header class="home-header">
        <span class="wordmark"><img class="brand-mark" src="assets/images/profile_circle.png" alt="" width="283" height="283" />MrJino</span>
        <div class="header-tools">
          <div class="language-switcher" role="group" aria-label="언어 선택">
            <button type="button" data-language="ko">한글</button><span aria-hidden="true">/</span><button type="button" data-language="en">English</button>
          </div>
          <span class="header-label">A PERSONAL SPACE</span>
        </div>
      </header>

      <main class="home-main">
        <div class="home-intro">
          <p class="eyebrow"><span aria-hidden="true"></span> WELCOME TO MY SPACE</p>
          <h1>MrJino<span>.</span></h1>
          <p class="intro-caption">어디로 가볼까요?</p>
          <span class="intro-arrow" aria-hidden="true">↘</span>
        </div>

        <nav id="destinations" class="destinations" aria-label="페이지 바로가기">
          <a class="destination" href="about/">
            <span class="destination-number" aria-hidden="true">01</span>
            <img src="assets/icons/portfolio-user.svg" alt="" aria-hidden="true" width="28" height="28" />
            <span class="destination-name">About<span>포트폴리오</span></span>
            <span class="destination-arrow" aria-hidden="true">↗</span>
          </a>
          <a class="destination" href="blog/">
            <span class="destination-number" aria-hidden="true">02</span>
            <img src="assets/icons/blog-book.svg" alt="" aria-hidden="true" width="28" height="28" />
            <span class="destination-name">Blog<span>개발의 기록</span></span>
            <span class="destination-arrow" aria-hidden="true">↗</span>
          </a>
          <a class="destination" href="history/">
            <span class="destination-number" aria-hidden="true">03</span>
            <img src="assets/icons/history-clock.svg" alt="" aria-hidden="true" width="28" height="28" />
            <span class="destination-name">History<span>지나온 시간</span></span>
            <span class="destination-arrow" aria-hidden="true">↗</span>
          </a>
          <a class="destination" href="https://gurunun.me" target="_blank" rel="noopener noreferrer">
            <span class="destination-number" aria-hidden="true">04</span>
            <img src="assets/icons/playground-grid.svg" alt="" aria-hidden="true" width="28" height="28" />
            <span class="destination-name">Gurunun<span>플레이그라운드 · 새 탭</span></span>
            <span class="destination-arrow" aria-hidden="true">↗</span>
          </a>
        </nav>
      </main>

      <footer class="home-footer"><span>© 2026 MrJino</span><span>EXPLORE AT YOUR OWN PACE.</span></footer>
    </div>
  </body>
</html>
