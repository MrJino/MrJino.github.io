<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
  <title id="title">북쪽이 위인 대장홍대선 예상 위치 지도와 성산역</title>
  <desc id="desc">서쪽 부천 대장에서 동쪽 서울 홍대입구까지 12개 정거장을 실제 생활권의 상대 위치에 맞춰 배치한 지도형 개략도. 원종은 서해선 연두색, 화곡은 5호선 보라색, 가양은 9호선 금색, 홍대입구는 2호선 녹색·경의중앙선 청록색·공항철도 파란색 동심 링으로 환승을 표시한다.</desc>
  <rect width="1000" height="720" rx="28" fill="#f8fafc"/>
  <rect x="20" y="20" width="960" height="680" rx="22" fill="#ffffff"/>

  <g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
    <text x="44" y="60" fill="#0f172a" font-size="30" font-weight="900">대장홍대선 예상 위치 지도</text>
    <text x="44" y="89" fill="#475569" font-size="17" font-weight="700">북쪽이 위 · 서쪽에서 동쪽으로 진행 · 실제 좌표·거리 축척이 아닌 지도형 개략도</text>

    <g aria-label="서쪽에서 동쪽으로 이어지는 지역 배경">
      <rect x="42" y="112" width="270" height="538" fill="#eff6ff"/>
      <polygon points="312,112 440,112 470,650 312,650" fill="#fefce8"/>
      <polygon points="440,112 650,112 690,650 470,650" fill="#f0fdf4"/>
      <polygon points="650,112 790,112 825,650 690,650" fill="#f5f3ff"/>
      <polygon points="790,112 958,112 958,650 825,650" fill="#fff7ed"/>

      <g transform="translate(0 130)">
        <path d="M470 112C527 144 579 166 629 187c82 35 177 61 329 111v91c-144-57-259-90-349-134-62-30-106-65-168-91Z" fill="#bae6fd"/>
        <text x="520" y="190" fill="#0369a1" font-size="23" font-weight="900">한강</text>

        <g fill="#64748b" font-size="19" font-weight="900" opacity=".8">
        <text x="70" y="145">부천</text>
        <text x="350" y="145">서울 양천</text>
        <text x="502" y="145">서울 강서</text>
        <text x="730" y="145">고양 덕은</text>
        <text x="870" y="145">서울 마포</text>
        </g>
      </g>
    </g>

    <g transform="translate(865 42)" font-family="Arial, sans-serif" font-weight="800">
      <circle cx="44" cy="28" r="27" fill="#e2e8f0"/>
      <path d="M44 5 34 29l10-5 10 5Z" fill="#334155"/>
      <text x="44" y="-2" fill="#334155" font-size="13" text-anchor="middle">N</text>
      <text x="8" y="33" fill="#334155" font-size="13">W</text>
      <text x="72" y="33" fill="#334155" font-size="13">E</text>
    </g>

    <g aria-label="서쪽 대장에서 동쪽 홍대입구까지의 대장홍대선 노선" transform="translate(0 130)">
      <polygon points="80.4,396.0 160.4,391.0 159.6,379.0 79.6,384.0" fill="#0f766e"/>
      <polygon points="158.4,390.8 248.4,415.8 251.6,404.2 161.6,379.2" fill="#0f766e"/>
      <polygon points="251.0,415.9 336.0,400.9 334.0,389.1 249.0,404.1" fill="#0f766e"/>
      <polygon points="336.7,400.8 421.7,375.8 418.3,364.2 333.3,389.2" fill="#0f766e"/>
      <polygon points="422.7,375.4 502.7,335.4 497.3,324.6 417.3,364.6" fill="#0f766e"/>
      <polygon points="503.1,335.1 578.1,290.1 571.9,279.9 496.9,324.9" fill="#0f766e"/>
      <polygon points="577.7,290.4 647.7,255.4 642.3,244.6 572.3,279.6" fill="#0f766e"/>
      <polygon points="650.2,252.9 695.2,172.9 684.8,167.1 639.8,247.1" fill="#0f766e"/>
      <polygon points="690.4,176.0 770.4,171.0 769.6,159.0 689.6,164.0" fill="#0f766e"/>
      <polygon points="766.3,169.7 836.3,224.7 843.7,215.3 773.7,160.3" fill="#0f766e"/>
      <polygon points="836.7,225.0 911.7,275.0 918.3,265.0 843.3,215.0" fill="#0f766e"/>
    </g>

    <g aria-label="정거장 위치" transform="translate(0 130)">
      <g><circle cx="80" cy="390" r="14" fill="#0f766e"/><circle cx="80" cy="390" r="8" fill="#ffffff"/></g>
      <g><circle cx="160" cy="385" r="14" fill="#0f766e"/><circle cx="160" cy="385" r="8" fill="#ffffff"/></g>
      <g aria-label="원종, 서해선 환승"><circle cx="250" cy="410" r="15" fill="#8fc31f"/><circle cx="250" cy="410" r="8" fill="#ffffff"/></g>
      <g><circle cx="335" cy="395" r="14" fill="#0f766e"/><circle cx="335" cy="395" r="8" fill="#ffffff"/></g>
      <g><circle cx="420" cy="370" r="14" fill="#0f766e"/><circle cx="420" cy="370" r="8" fill="#ffffff"/></g>
      <g aria-label="화곡, 5호선 환승"><circle cx="500" cy="330" r="15" fill="#996cac"/><circle cx="500" cy="330" r="8" fill="#ffffff"/></g>
      <g><circle cx="575" cy="285" r="14" fill="#0f766e"/><circle cx="575" cy="285" r="8" fill="#ffffff"/></g>
      <g aria-label="가양, 9호선 환승"><circle cx="645" cy="250" r="15" fill="#aa9872"/><circle cx="645" cy="250" r="8" fill="#ffffff"/></g>
      <g><circle cx="690" cy="170" r="14" fill="#0f766e"/><circle cx="690" cy="170" r="8" fill="#ffffff"/></g>
      <g><circle cx="770" cy="165" r="14" fill="#0f766e"/><circle cx="770" cy="165" r="8" fill="#ffffff"/></g>
      <g aria-label="홍대입구, 2호선·경의중앙선·공항철도 환승"><circle cx="915" cy="270" r="18" fill="#0090d2"/><circle cx="915" cy="270" r="14" fill="#77c4a3"/><circle cx="915" cy="270" r="10" fill="#00a84d"/><circle cx="915" cy="270" r="5" fill="#ffffff"/></g>
    </g>

    <g font-size="16" font-weight="900" transform="translate(0 130)">
      <g><rect x="43" y="324" width="68" height="46" rx="12" fill="#ffffff" fill-opacity=".88" stroke="#cbd5e1" stroke-width="1"/><text x="54" y="343" fill="#0f766e" font-size="13">100</text><text x="54" y="362" fill="#0f172a">대장</text></g>
      <g><rect x="123" y="409" width="68" height="46" rx="12" fill="#ffffff" fill-opacity=".88" stroke="#cbd5e1" stroke-width="1"/><text x="134" y="428" fill="#0f766e" font-size="13">101</text><text x="134" y="447" fill="#0f172a">오정</text></g>
      <g><rect x="205" y="432" width="68" height="46" rx="12" fill="#ffffff" fill-opacity=".88" stroke="#cbd5e1" stroke-width="1"/><text x="216" y="451" fill="#0f766e" font-size="13">102</text><text x="216" y="470" fill="#0f172a">원종</text></g>
      <g><rect x="298" y="326" width="68" height="46" rx="12" fill="#ffffff" fill-opacity=".88" stroke="#cbd5e1" stroke-width="1"/><text x="309" y="345" fill="#0f766e" font-size="13">103</text><text x="309" y="364" fill="#0f172a">고강</text></g>
      <g><rect x="388" y="394" width="68" height="46" rx="12" fill="#ffffff" fill-opacity=".88" stroke="#cbd5e1" stroke-width="1"/><text x="399" y="413" fill="#0f766e" font-size="13">104</text><text x="399" y="432" fill="#0f172a">신월</text></g>
      <g><rect x="456" y="256" width="68" height="46" rx="12" fill="#ffffff" fill-opacity=".88" stroke="#cbd5e1" stroke-width="1"/><text x="467" y="275" fill="#0f766e" font-size="13">105</text><text x="467" y="294" fill="#0f172a">화곡</text></g>
      <g><rect x="523" y="306" width="92" height="48" rx="12" fill="#ffffff" fill-opacity=".88" stroke="#cbd5e1" stroke-width="1"/><text x="534" y="325" fill="#0f766e" font-size="13">106</text><text x="534" y="345" fill="#0f172a">강서구청</text></g>
      <g><rect x="600" y="270" width="68" height="46" rx="12" fill="#ffffff" fill-opacity=".88" stroke="#cbd5e1" stroke-width="1"/><text x="611" y="289" fill="#0f766e" font-size="13">107</text><text x="611" y="308" fill="#0f172a">가양</text></g>
      <g><rect x="600" y="117" width="68" height="46" rx="12" fill="#ffffff" fill-opacity=".88" stroke="#cbd5e1" stroke-width="1"/><text x="611" y="136" fill="#0f766e" font-size="13">108</text><text x="611" y="155" fill="#0f172a">덕은</text></g>
      <g><rect x="738" y="185" width="68" height="46" rx="12" fill="#ffffff" fill-opacity=".88" stroke="#cbd5e1" stroke-width="1"/><text x="749" y="204" fill="#0f766e" font-size="13">109</text><text x="749" y="223" fill="#0f172a">상암</text></g>
      <g><rect x="862" y="294" width="92" height="46" rx="12" fill="#ffffff" fill-opacity=".88" stroke="#cbd5e1" stroke-width="1"/><text x="873" y="313" fill="#0f766e" font-size="13">111</text><text x="873" y="332" fill="#0f172a">홍대입구</text></g>
    </g>

    <g aria-label="110 성산역 강조 위치 핀">
      <polygon points="837,213 843,213 843,324 837,324" fill="#f97316"/>
      <circle cx="840" cy="350" r="29" fill="#ffedd5"/>
      <path d="M840 322c-14 0-25 11-25 25 0 18 25 42 25 42s25-24 25-42c0-14-11-25-25-25Z" fill="#f97316"/>
      <circle cx="840" cy="348" r="8" fill="#ffffff"/>
      <rect x="704" y="113" width="246" height="100" rx="18" fill="#ffffff" stroke="#fb923c" stroke-width="2"/>
      <text x="724" y="140" fill="#9a3412" font-size="16" font-weight="900">이 글의 중심</text>
      <text x="724" y="171" fill="#7c2d12" font-size="25" font-weight="900">110 성산역 (가칭)</text>
      <text x="724" y="196" fill="#9a3412" font-size="15" font-weight="800">기존 철도 직접 환승 아님</text>
    </g>

    <g transform="translate(44 665)">
      <rect width="912" height="28" rx="14" fill="#e2e8f0"/>
      <text x="456" y="19" fill="#334155" font-size="13" font-weight="800" text-anchor="middle">북쪽을 위로 두고 생활권의 상대 위치를 단순화했습니다. 길 찾기·정확한 좌표 또는 거리 계산용 지도가 아닙니다.</text>
    </g>
  </g>
</svg>
