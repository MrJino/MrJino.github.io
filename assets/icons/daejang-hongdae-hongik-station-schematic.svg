    <g aria-label="111 홍대입구역 강조 위치 핀과 2호선·경의중앙선·공항철도 환승 계획">
      <path d="M915 223V365" fill="none" stroke="#f97316" stroke-width="5" stroke-linecap="round"/>
      <circle cx="915" cy="380" r="24" fill="#ffedd5" fill-opacity=".9"/>
      <path d="M915 358c-11 0-20 9-20 20 0 15 20 34 20 34s20-19 20-34c0-11-9-20-20-20Z" fill="#f97316"/>
      <circle cx="915" cy="378" r="7" fill="#ffffff"/>
      <rect x="704" y="113" width="254" height="110" rx="18" fill="#ffffff" fill-opacity=".92" stroke="#fb923c" stroke-width="2"/>
      <text x="724" y="141" fill="#9a3412" font-size="16" font-weight="900">이 글의 중심</text>
      <text x="724" y="173" fill="#7c2d12" font-size="25" font-weight="900">111 홍대입구역</text>
      <g transform="translate(727 199)" aria-hidden="true">
        <circle cx="0" cy="0" r="11" fill="#0090d2"/>
        <circle cx="0" cy="0" r="8" fill="#77c4a3"/>
        <circle cx="0" cy="0" r="5" fill="#00a84d"/>
        <circle cx="0" cy="0" r="2" fill="#ffffff"/>
      </g>
      <text x="746" y="204" fill="#9a3412" font-size="15" font-weight="800">기존 3개 철도 환승 계획</text>
    </g>

    <g transform="translate(44 665)">
      <rect width="912" height="28" rx="14" fill="#e2e8f0"/>
      <text x="456" y="19" fill="#334155" font-size="13" font-weight="800" text-anchor="middle">북쪽을 위로 두고 생활권의 상대 위치를 단순화했습니다. 길 찾기·정확한 좌표 또는 거리 계산용 지도가 아닙니다.</text>
    </g>
  </g>
</svg>
