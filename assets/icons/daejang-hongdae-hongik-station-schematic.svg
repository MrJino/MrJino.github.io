      <g><circle cx="80" cy="390" r="14" fill="#0f766e"/><circle cx="80" cy="390" r="8" fill="#ffffff"/></g>
      <g><circle cx="160" cy="385" r="14" fill="#0f766e"/><circle cx="160" cy="385" r="8" fill="#ffffff"/></g>
      <g aria-label="원종, 서해선 환승"><circle cx="250" cy="410" r="15" fill="#8fc31f"/><circle cx="250" cy="410" r="8" fill="#ffffff"/></g>
      <g><circle cx="335" cy="395" r="14" fill="#0f766e"/><circle cx="335" cy="395" r="8" fill="#ffffff"/></g>
      <g><circle cx="420" cy="370" r="14" fill="#0f766e"/><circle cx="420" cy="370" r="8" fill="#ffffff"/></g>
      <g aria-label="화곡, 5호선 환승"><circle cx="500" cy="330" r="15" fill="#996cac"/><circle cx="500" cy="330" r="8" fill="#ffffff"/></g>
      <g><circle cx="575" cy="285" r="14" fill="#0f766e"/><circle cx="575" cy="285" r="8" fill="#ffffff"/></g>
      <g aria-label="가양, 9호선 환승"><circle cx="645" cy="250" r="15" fill="#aa9872"/><circle cx="645" cy="250" r="8" fill="#ffffff"/></g>
      <g><circle cx="690" cy="170" r="14" fill="#0f766e"/><circle cx="690" cy="170" r="8" fill="#ffffff"/></g>
      <g><circle cx="770" cy="165" r="14" fill="#0f766e"/><circle cx="770" cy="165" r="8" fill="#ffffff"/></g>
      <g><circle cx="840" cy="220" r="14" fill="#0f766e"/><circle cx="840" cy="220" r="8" fill="#ffffff"/></g>
      <g aria-label="홍대입구, 2호선·경의중앙선·공항철도 환승"><circle cx="915" cy="270" r="20" fill="#0090d2"/><circle cx="915" cy="270" r="15" fill="#77c4a3"/><circle cx="915" cy="270" r="10" fill="#00a84d"/><circle cx="915" cy="270" r="5" fill="#ffffff"/></g>
    </g>

    <g font-size="16" font-weight="900" transform="translate(0 130)">
      <g><rect x="43" y="324" width="68" height="46" rx="12" fill="#ffffff" fill-opacity=".88" stroke="#cbd5e1" stroke-width="1"/><text x="54" y="343" fill="#0f766e" font-size="13">100</text><text x="54" y="362" fill="#0f172a">대장</text></g>
      <g><rect x="123" y="409" width="68" height="46" rx="12" fill="#ffffff" fill-opacity=".88" stroke="#cbd5e1" stroke-width="1"/><text x="134" y="428" fill="#0f766e" font-size="13">101</text><text x="134" y="447" fill="#0f172a">오정</text></g>
      <g><rect x="205" y="432" width="68" height="46" rx="12" fill="#ffffff" fill-opacity=".88" stroke="#cbd5e1" stroke-width="1"/><text x="216" y="451" fill="#0f766e" font-size="13">102</text><text x="216" y="470" fill="#0f172a">원종</text></g>
      <g><rect x="298" y="326" width="68" height="46" rx="12" fill="#ffffff" fill-opacity=".88" stroke="#cbd5e1" stroke-width="1"/><text x="309" y="345" fill="#0f766e" font-size="13">103</text><text x="309" y="364" fill="#0f172a">고강</text></g>
      <g><rect x="388" y="394" width="68" height="46" rx="12" fill="#ffffff" fill-opacity=".88" stroke="#cbd5e1" stroke-width="1"/><text x="399" y="413" fill="#0f766e" font-size="13">104</text><text x="399" y="432" fill="#0f172a">신월</text></g>
      <g><rect x="456" y="256" width="68" height="46" rx="12" fill="#ffffff" fill-opacity=".88" stroke="#cbd5e1" stroke-width="1"/><text x="467" y="275" fill="#0f766e" font-size="13">105</text><text x="467" y="294" fill="#0f172a">화곡</text></g>
      <g><rect x="523" y="306" width="92" height="48" rx="12" fill="#ffffff" fill-opacity=".88" stroke="#cbd5e1" stroke-width="1"/><text x="534" y="325" fill="#0f766e" font-size="13">106</text><text x="534" y="345" fill="#0f172a">강서구청</text></g>
      <g><rect x="600" y="270" width="68" height="46" rx="12" fill="#ffffff" fill-opacity=".88" stroke="#cbd5e1" stroke-width="1"/><text x="611" y="289" fill="#0f766e" font-size="13">107</text><text x="611" y="308" fill="#0f172a">가양</text></g>
      <g><rect x="600" y="117" width="68" height="46" rx="12" fill="#ffffff" fill-opacity=".88" stroke="#cbd5e1" stroke-width="1"/><text x="611" y="136" fill="#0f766e" font-size="13">108</text><text x="611" y="155" fill="#0f172a">덕은</text></g>
      <g><rect x="738" y="185" width="68" height="46" rx="12" fill="#ffffff" fill-opacity=".88" stroke="#cbd5e1" stroke-width="1"/><text x="749" y="204" fill="#0f766e" font-size="13">109</text><text x="749" y="223" fill="#0f172a">상암</text></g>
      <g><rect x="796" y="240" width="68" height="46" rx="12" fill="#ffffff" fill-opacity=".84" stroke="#cbd5e1" stroke-width="1"/><text x="807" y="259" fill="#0f766e" font-size="13">110</text><text x="807" y="278" fill="#0f172a">성산</text></g>
