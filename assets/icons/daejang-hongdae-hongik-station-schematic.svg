<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
  <title id="title">북쪽이 위인 대장홍대선 예상 위치 지도와 홍대입구역</title>
  <desc id="desc">서쪽 부천 대장에서 동쪽 서울 홍대입구까지 12개 정거장을 생활권의 상대 위치에 맞춰 배치한 지도형 개략도. 110 성산은 일반 정거장으로 표시하고, 종점인 111 홍대입구는 주황색 위치 핀과 2호선·경의중앙선·공항철도 색상의 동심 링으로 강조한다.</desc>
  <rect width="1000" height="720" rx="28" fill="#f8fafc"/>
  <rect x="20" y="20" width="960" height="680" rx="22" fill="#ffffff"/>

  <g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
    <text x="44" y="60" fill="#0f172a" font-size="30" font-weight="900">대장홍대선 예상 위치 지도</text>
    <text x="44" y="89" fill="#475569" font-size="17" font-weight="700">북쪽이 위 · 서쪽에서 동쪽으로 진행 · 실제 좌표·거리 축척이 아닌 지도형 개략도</text>

    <g aria-label="서쪽에서 동쪽으로 이어지는 지역 배경">
      <rect x="42" y="112" width="270" height="538" fill="#eff6ff"/>
      <polygon points="312,112 440,112 470,650 312,650" fill="#fefce8"/>
      <polygon points="440,112 650,112 690,650 470,650" fill="#f0fdf4"/>
      <polygon points="650,112 790,112 825,650 690,650" fill="#f5f3ff"/>
      <polygon points="790,112 958,112 958,650 825,650" fill="#fff7ed"/>

      <g transform="translate(0 130)">
        <path d="M470 112C527 144 579 166 629 187c82 35 177 61 329 111v91c-144-57-259-90-349-134-62-30-106-65-168-91Z" fill="#bae6fd"/>
        <text x="520" y="190" fill="#0369a1" font-size="23" font-weight="900">한강</text>

        <g fill="#64748b" font-size="19" font-weight="900" opacity=".8">
        <text x="70" y="145">부천</text>
        <text x="350" y="145">서울 양천</text>
        <text x="502" y="145">서울 강서</text>
        <text x="730" y="145">고양 덕은</text>
        <text x="870" y="145">서울 마포</text>
        </g>
      </g>
    </g>

    <g transform="translate(865 42)" font-family="Arial, sans-serif" font-weight="800">
      <circle cx="44" cy="28" r="27" fill="#e2e8f0"/>
      <path d="M44 5 34 29l10-5 10 5Z" fill="#334155"/>
      <text x="44" y="-2" fill="#334155" font-size="13" text-anchor="middle">N</text>
      <text x="8" y="33" fill="#334155" font-size="13">W</text>
      <text x="72" y="33" fill="#334155" font-size="13">E</text>
    </g>

    <g aria-label="서쪽 대장에서 동쪽 홍대입구까지의 대장홍대선 노선" transform="translate(0 130)">
      <polygon points="80.4,396.0 160.4,391.0 159.6,379.0 79.6,384.0" fill="#0f766e"/>
      <polygon points="158.4,390.8 248.4,415.8 251.6,404.2 161.6,379.2" fill="#0f766e"/>
      <polygon points="251.0,415.9 336.0,400.9 334.0,389.1 249.0,404.1" fill="#0f766e"/>
      <polygon points="336.7,400.8 421.7,375.8 418.3,364.2 333.3,389.2" fill="#0f766e"/>
      <polygon points="422.7,375.4 502.7,335.4 497.3,324.6 417.3,364.6" fill="#0f766e"/>
      <polygon points="503.1,335.1 578.1,290.1 571.9,279.9 496.9,324.9" fill="#0f766e"/>
      <polygon points="577.7,290.4 647.7,255.4 642.3,244.6 572.3,279.6" fill="#0f766e"/>
      <polygon points="650.2,252.9 695.2,172.9 684.8,167.1 639.8,247.1" fill="#0f766e"/>
      <polygon points="690.4,176.0 770.4,171.0 769.6,159.0 689.6,164.0" fill="#0f766e"/>
      <polygon points="766.3,169.7 836.3,224.7 843.7,215.3 773.7,160.3" fill="#0f766e"/>
      <polygon points="836.7,225.0 911.7,275.0 918.3,265.0 843.3,215.0" fill="#0f766e"/>
    </g>

