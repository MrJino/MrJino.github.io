<svg xmlns="http://www.w3.org/2000/svg" width="914" height="1105" viewBox="0 0 914 1105" role="img" aria-labelledby="title description">
  <title id="title">대화형 팝업 예시</title>
  <desc id="description">질문과 선택지를 대화 형식으로 보여주고 하단에 한 줄 입력란과 다음 버튼을 제공하는 나만의 카드 만들기 팝업입니다.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#183126" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="914" height="1105" fill="#737a6f"/>
  <rect x="8" y="9" width="898" height="1088" rx="28" fill="#fff"/>

  <text x="47" y="72" fill="#15241b" font-family="Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="32" font-weight="750">나만의 카드 만들기</text>
  <text x="48" y="111" fill="#6b766f" font-family="Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="18">질문에 답하면 이 토픽에 새로운 학습카드를 간편하게 추가할 수 있어요.</text>
  <circle cx="839" cy="78" r="26" fill="#f4f6f4"/>
  <path d="m832 71 14 14m0-14-14 14" fill="none" stroke="#758078" stroke-width="3" stroke-linecap="round"/>
  <path d="M8 147h898" stroke="#e5e9e6"/>

  <rect x="8" y="148" width="898" height="814" fill="#fbfdfb"/>
  <rect x="47" y="182" width="52" height="52" rx="17" fill="#2d8057"/>
  <text x="73" y="216" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="22" font-weight="700">C</text>
  <rect x="113" y="182" width="607" height="198" rx="23" fill="#e0efe7"/>
  <g fill="#68766e" font-family="Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="19" font-weight="650">
    <text x="135" y="225">나만의 단어장을 만들고 퀴즈를 풀어 보세요.</text>
    <text x="135" y="287">• 기본 단어카드를 만들고 단어카드를 기반으로 퀴즈를 풀 수 있어요</text>
    <text x="135" y="320">• 원하는 질문과 정답으로 별도의 퀴즈 카드를 만들어 학습할 수 있어요</text>
    <text x="135" y="353">• 학습 이미지를 AI로 분석해 여러 단어카드 후보를 만들 수 있어요.</text>
  </g>

  <rect x="47" y="404" width="52" height="52" rx="17" fill="#2d8057"/>
  <text x="73" y="438" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="22" font-weight="700">C</text>
  <rect x="113" y="404" width="286" height="68" rx="23" fill="#e0efe7"/>
  <text x="135" y="447" fill="#68766e" font-family="Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="19" font-weight="650">어떤 형식의 카드를 만들까요?</text>

  <g filter="url(#shadow)">
    <rect x="48" y="711" width="712" height="266" rx="20" fill="#fff" stroke="#e4e9e5"/>
    <rect x="59" y="722" width="690" height="78" rx="17" fill="#eaf4ef" stroke="#69a184" stroke-width="3"/>
    <rect x="71" y="738" width="45" height="45" rx="14" fill="#dceaf4"/>
    <circle cx="93.5" cy="760.5" r="10" fill="#fff"/>
    <circle cx="93.5" cy="760.5" r="5" fill="#5d94ed"/>
    <text x="130" y="770" fill="#226644" font-family="Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="20" font-weight="700">단어와 정의를 직접 입력</text>
    <path d="m720 756 6 6 11-13" fill="none" stroke="#216944" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="71" y="821" width="45" height="45" rx="14" fill="#eef4fd"/>
    <circle cx="93.5" cy="843.5" r="10" fill="#fff"/>
    <circle cx="93.5" cy="843.5" r="5" fill="#6d9bec"/>
    <text x="130" y="853" fill="#19271f" font-family="Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="20" font-weight="700">질문과 정답을 직접 입력</text>

    <rect x="71" y="905" width="45" height="45" rx="14" fill="#eef4fd"/>
    <circle cx="93.5" cy="927.5" r="10" fill="#fff"/>
    <circle cx="93.5" cy="927.5" r="5" fill="#6d9bec"/>
    <text x="130" y="937" fill="#19271f" font-family="Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="20" font-weight="700">이미지를 등록하여 AI에게 생성 요청</text>
  </g>

  <path d="M8 963h898" stroke="#e5e9e6"/>
  <rect x="47" y="989" width="714" height="75" rx="22" fill="#fff" stroke="#2d8057" stroke-width="2" filter="url(#shadow)"/>
  <rect x="63" y="1001" width="45" height="45" rx="14" fill="#eef4fd"/>
  <circle cx="85.5" cy="1023.5" r="10" fill="#fff"/>
  <circle cx="85.5" cy="1023.5" r="5" fill="#6d9bec"/>
  <text x="121" y="1034" fill="#19271f" font-family="Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="20" font-weight="700">단어와 정의를 직접 입력</text>
  <path d="m721 1030 8-8 8 8" fill="none" stroke="#1d2b23" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="774" y="992" width="91" height="72" rx="17" fill="#2d8057"/>
  <text x="819.5" y="1037" text-anchor="middle" fill="#fff" font-family="Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="24" font-weight="700">다음</text>
</svg>
