<svg xmlns="http://www.w3.org/2000/svg" width="914" height="1106" viewBox="0 0 914 1106" role="img" aria-labelledby="title description">
  <title id="title">여러 줄 입력용 보조 팝업 예시</title>
  <desc id="description">대화형 팝업 위에 핵심 뜻을 여러 줄로 입력할 수 있는 별도의 입력 팝업이 표시된 화면입니다.</desc>
  <defs>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#16241b" flood-opacity=".24"/>
    </filter>
  </defs>
  <rect width="914" height="1106" fill="#747c70"/>
  <g filter="url(#blur)" opacity=".92">
    <rect x="9" y="9" width="896" height="1088" rx="28" fill="#fff"/>
    <text x="47" y="72" fill="#15241b" font-family="Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="32" font-weight="750">나만의 카드 만들기</text>
    <text x="48" y="111" fill="#6b766f" font-family="Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="18">질문에 답하면 이 토픽에 새로운 학습카드를 간편하게 추가할 수 있어요.</text>
    <rect x="113" y="181" width="607" height="198" rx="23" fill="#e0efe7"/>
    <rect x="47" y="181" width="52" height="52" rx="17" fill="#2d8057"/>
    <rect x="113" y="403" width="286" height="68" rx="23" fill="#e0efe7"/>
    <rect x="47" y="403" width="52" height="52" rx="17" fill="#2d8057"/>
    <rect x="113" y="562" width="470" height="68" rx="23" fill="#e0efe7"/>
    <rect x="47" y="562" width="52" height="52" rx="17" fill="#2d8057"/>
    <rect x="113" y="694" width="390" height="68" rx="23" fill="#e0efe7"/>
    <rect x="47" y="694" width="52" height="52" rx="17" fill="#2d8057"/>
    <rect x="47" y="994" width="818" height="71" rx="20" fill="#2d8057"/>
  </g>
  <rect width="914" height="1106" fill="#26342b" opacity=".32"/>

  <g filter="url(#shadow)">
    <rect x="59" y="263" width="800" height="580" rx="26" fill="#fff"/>
    <text x="96" y="324" fill="#17241c" font-family="Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="28" font-weight="750">핵심 뜻 입력</text>
    <text x="96" y="367" fill="#66736b" font-family="Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="18">“○○□”의 핵심 뜻을 어떻게 설명할까요?</text>
    <circle cx="798" cy="321" r="26" fill="#f3f5f3"/>
    <path d="m791 314 14 14m0-14-14 14" fill="none" stroke="#78837c" stroke-width="3" stroke-linecap="round"/>
    <path d="M59 401h800" stroke="#e5e9e6"/>

    <text x="96" y="455" fill="#66736b" font-family="Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="18">정답 단어를 그대로 반복하지 않고 간결하게 설명해 주세요.</text>
    <rect x="92" y="474" width="734" height="217" rx="23" fill="#fbfcfb" stroke="#75a78d" stroke-width="2"/>
    <rect x="88" y="470" width="742" height="225" rx="27" fill="none" stroke="#dcece4" stroke-width="5"/>
    <text x="120" y="528" fill="#7c827e" font-family="Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="23">핵심 의미를 입력해 주세요.</text>
    <path d="m806 674 10-10m-5 12 6-6" stroke="#78817b" stroke-width="2" stroke-linecap="round"/>

    <path d="M59 723h800" stroke="#e5e9e6"/>
    <rect x="579" y="747" width="91" height="69" rx="17" fill="#fff" stroke="#dfe4e1"/>
    <text x="624.5" y="791" text-anchor="middle" fill="#1e2922" font-family="Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="23" font-weight="700">취소</text>
    <rect x="683" y="747" width="141" height="69" rx="17" fill="#2d8057"/>
    <text x="753.5" y="791" text-anchor="middle" fill="#fff" font-family="Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="23" font-weight="700">입력 완료</text>
  </g>
</svg>
